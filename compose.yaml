services:
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      SPHEREX_CACHE_DIR: /app/.cache
      SPHEREX_DISCOVERY_MIRROR: /app/.cache/discovery.sqlite3
      SPHEREX_DISCOVERY_MODE: ${SPHEREX_DISCOVERY_MODE:-auto}
      SPHEREX_MAX_PARALLEL: ${SPHEREX_MAX_PARALLEL:-10}
    volumes:
      - type: bind
        source: ${CACHE_HOST_PATH:-/var/lib/oh-deer/cache}
        target: /app/.cache
        bind:
          create_host_path: false
    # Host Nginx connects over loopback; never bind the API to a public interface.
    ports:
      - "127.0.0.1:8000:8000"
    stop_grace_period: 60s
