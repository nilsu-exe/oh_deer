user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_header_timeout 15s;
    client_body_timeout 15s;
    client_max_body_size 1m;

    # Trust the visitor header only from Cloudflare's published edge ranges.
    include /etc/nginx/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;

    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    map $uri $compute_client {
        default "";
        ~^/api/(frames|detectors|spectrum|lightcurve|overlays)(/|$) $binary_remote_addr;
    }
    # Empty keys are not counted, so metadata endpoints avoid this tighter cap.
    limit_req_zone $compute_client zone=compute:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=client_connections:10m;
    limit_conn_zone $server_name zone=server_connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # Docker DNS is re-resolved after backend container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        # Cloudflare Origin CA certificate and private key; Full (strict) mode.
        ssl_certificate /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        add_header X-Content-Type-Options nosniff always;

        root /usr/share/nginx/html;
        index index.html;

        location ~ ^/(api(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
            limit_req zone=api burst=20 nodelay;
            limit_req zone=compute burst=6 nodelay;
            limit_conn client_connections 4;
            limit_conn server_connections 16;
            error_page 429 = @rate_limited;

            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            return 429 '{"detail":"Too many requests. Please retry shortly."}';
        }

        # Vite's fingerprinted assets; missing assets must not return SPA HTML.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location ~ /\. {
            deny all;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
